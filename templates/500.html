{% extends "base.html" %}

{% block title %}Помилка сервера{% endblock %}

{% block content %}
  <h1>Виникла внутрішня помилка</h1>
  <p>Наші технічні гноми вже працюють над вирішенням проблеми 🛠️</p>

  {% if detail %}
    <div class="error-detail" style="margin-top: 20px; color: #888;">
      <strong>Деталі для чарівників (розробників):</strong>
      <pre>{{ detail }}</pre>
    </div>
  {% endif %}
{% endblock %}
